<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login / Sign Up</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="assets/css/auth.css">
  <script src="assets/js/login.js" defer></script>
</head>
<body>

<div class="page-bg">

  <!-- Navbar -->
  <nav class="navbar">
    <div class="nav-container">
      <a class="logo" href="INDEXWEB.HTML">
        <img class="logo-img" src="assets/images/logo.svg">
      </a>

      <button class="hamburger" id="hamburger">☰</button>

      <ul class="nav-links" id="nav-links">
        <li><a href="INDEXWEB.HTML">Home</a></li>
        <li><a href="ABOUTWEB.HTML">About</a></li>
        <li><a href="SPOTSWEB.HTML">Spots</a></li>
        <li><a href="CONTACTWEB.HTML">Contacts</a></li>
        <li><a href="LOGINWEB.HTML">Login</a></li>
      </ul>
    </div>
  </nav>

  <!-- Main Section -->
  <main class="container">

  <section class="auth-tabs">
    <button id="showSignup">Sign Up</button>
    <button id="showLogin">Login</button>
  </section>

  <!-- Sign Up Form -->
  <!-- Username -->
  <section id="signupForm" class="auth-form" style="display: block;">
    <h2>Create Account</h2>
    <form id="signupFormElement" action="SUBMITWEB.HTML" method="POST">
      <label for="username">Username:</label>
      <input type="text" id="username" name="username" required placeholder="e.g., ariabrookyln">

      <!-- Email -->
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required placeholder="yourname@email.com">

       <!-- Password -->
      <label for="password">Password:</label>
<div style="display: flex; align-items: center;">
     <input type="password" id="signupPassword">
<button type="button" class="toggle-password" data-target="signupPassword">👁️</button></div>
     </label>

      <!-- Confirm Password -->
      <label for="signupConfirmPassword">Confirm Password:</label>
<div style="display: flex; align-items: center;">
  <input type="password" id="signupConfirmPassword" required>
  <button type="button" class="toggle-password" data-target="signupConfirmPassword">👁️</button></div>
     </label>

      <!-- Submit -->
      <button type="submit">Sign Up</button>
    </form>
  </section>

  <!-- Login Form -->
  <section id="loginSection" class="auth-form" style="display: none;">
    <h2>Welcome Back</h2>
    <form id="login-form">
      <label for="login-email">Email:</label>
      <input type="email" id="login-email" name="email" required>

      <label for="login-password">Password:</label>
<div style="display: flex; align-items: center;">
      <input type="password" id="loginPassword">
<button type="button" class="toggle-password" data-target="loginPassword">👁️</button></div>
      </label>

      <!-- Role functionality-->
      <label for="role">Login As:</label>
      <select id="role" name="role" required>
        <option value="">-- Select your role --</option>
        <option value="customer">Customer</option>
        <option value="vendor">Vendor</option>
      </select>

      <div id="vendor-code-section" style="display: none;">
        <label for="vendor-code">Vendor Code:</label>
        <input type="text" id="vendor-code" name="vendor-code">
      </div>

      <div id="vendor-password-section" style="display: none;">
        <label for="vendor-password">Vendor Password:</label>
        <input type="password" id="vendor-password" name="vendor-password">
        <label><input type="checkbox" onclick="togglePassword('vendor-password')"> Show Password</label>
      </div>

      <!-- Submit-->
      <button type="submit">Login</button>
    </form>
  </section>

</main>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; Made by foodies @ Sunway University ❤️ | All Rights Reserved</p>
  </footer>

</div>

</body>
</html>
